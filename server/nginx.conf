worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stderr;

    client_max_body_size 100m;

    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;

    map $request_uri $workflow_proxy_path {
        default $request_uri;
        ~^/api/userdata/workflows(?:/|%2[Ff])(?<workflow_part7>[^/?]+)(?:/|%2[Ff])(?<workflow_part8>[^/?]+)(?:/|%2[Ff])(?<workflow_part9>[^/?]+)(?:/|%2[Ff])(?<workflow_part10>[^/?]+)(?<workflow_query4>\?.*)?$ /api/userdata/workflows%2F$workflow_part7%2F$workflow_part8%2F$workflow_part9%2F$workflow_part10$workflow_query4;
        ~^/api/userdata/workflows(?:/|%2[Ff])(?<workflow_part4>[^/?]+)(?:/|%2[Ff])(?<workflow_part5>[^/?]+)(?:/|%2[Ff])(?<workflow_part6>[^/?]+)(?<workflow_query3>\?.*)?$ /api/userdata/workflows%2F$workflow_part4%2F$workflow_part5%2F$workflow_part6$workflow_query3;
        ~^/api/userdata/workflows(?:/|%2[Ff])(?<workflow_part2>[^/?]+)(?:/|%2[Ff])(?<workflow_part3>[^/?]+)(?<workflow_query2>\?.*)?$ /api/userdata/workflows%2F$workflow_part2%2F$workflow_part3$workflow_query2;
        ~^/api/userdata/workflows(?:/|%2[Ff])(?<workflow_part1>[^/?]+)(?<workflow_query1>\?.*)?$ /api/userdata/workflows%2F$workflow_part1$workflow_query1;
    }

    upstream comfyui {
        server 127.0.0.1:8188;
        keepalive 32;
    }

    server {
        listen 8000;
        server_name _;

        # -- WebSocket: /ws --
        location /ws {
            proxy_pass http://comfyui;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ComfyUI expects workflow userdata paths as one encoded path segment.
        # Modal may decode %2F before nginx sees the request, so build the
        # upstream path from the original request URI and preserve query args.
        location ~ ^/api/userdata/workflows/(.+)$ {
            proxy_pass http://comfyui$workflow_proxy_path;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ComfyUI Manager reboots the server by exiting ComfyUI; the supervisor
        # then relaunches it. nginx loses its upstream mid-request, so the
        # proxied reboot call surfaces as 502/503/504 even though the restart
        # is exactly what was asked for. Only those teardown codes are mapped
        # to an "accepted, wait for reconnect" response; every other Manager
        # endpoint keeps its real upstream status.
        location = /api/v2/manager/reboot {
            proxy_pass http://comfyui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_intercept_errors on;
            error_page 502 503 504 = /_nginx/manager_reboot_accepted;
        }

        location = /_nginx/manager_reboot_accepted {
            internal;
            default_type application/json;
            return 202 "{}";
        }

        # -- Default catch-all --
        location / {
            proxy_pass http://comfyui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
